{% extends 'base.html' %}
{% block title %}Add restaurant{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Add restaurant</h2>
    <form action="{% url 'add_restaurant' %}" method="POST">
        {% csrf_token %}
        <div class="field">
            <label for="name">Restaurant name</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="field">
            <label for="picture">Picture URL</label>
            <input type="text" id="picture" name="picture">
        </div>
        <div class="field">
            <label for="cuisine">Cuisine</label>
            <input type="text" id="cuisine" name="cuisine">
        </div>
        <div class="field">
            <label for="rating">Rating</label>
            <input type="number" id="rating" min="0" max="5" name="rating">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Add restaurant</button>
    </form>
</div>
{% endblock %}
