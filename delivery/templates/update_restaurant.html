{% extends 'base.html' %}
{% block title %}Update Restaurant{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Update {{ restaurant.name }}</h2>
    <form action="{% url 'update_restaurant' restaurant.id %}" method="POST">
        {% csrf_token %}
        
        <div class="field">
            <label for="name">Restaurant Name</label>
            <input type="text" id="name" name="name" value="{{ restaurant.name }}" required>
        </div>

        <div class="field">
            <label for="picture">Picture URL</label>
            <input type="text" id="picture" name="picture" value="{{ restaurant.picture }}" required>
        </div>

        <div class="field">
            <label for="cuisine">Cuisine</label>
            <input type="text" id="cuisine" name="cuisine" value="{{ restaurant.cuisine }}" required>
        </div>

        <div class="field">
            <label for="rating">Rating</label>
            <input type="number" id="rating" name="rating" min="0" max="5" step="0.1" value="{{ restaurant.rating|floatformat:1 }}" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Update Restaurant</button>
    </form>
</div>
{% endblock %}
