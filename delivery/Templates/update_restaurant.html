{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}
{% block nav_right %}
<a href="open_add_restaurant">Add restaurant</a>
{% endblock %}
{% block content %}
<div class="container">
    <h1>Restaurants</h1>

    {% for r in restaurantList %}
        <div class="row-card">
            <img src="{{ r.picture }}" alt="{{ r.name }}">
            <div class="info">
                <div class="name">{{ r.name }}</div>
                <div class="desc">{{ r.cuisine }} · ★ {{ r.rating }}</div>
            </div>
            <div class="actions">
                <a href="{% url 'open_update_menu' r.id %}" class="btn btn-ghost btn-sm">Menu</a>
                <a href="{% url 'open_update_restaurant' r.id %}" class="btn btn-ghost btn-sm">Edit</a>
                <a href="{% url 'delete_restaurant' r.id %}" class="btn btn-danger btn-sm js-confirm-delete">Delete</a>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
