<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>customer page</title>
</head>
<body>
    <h1>Welcome {{username}}</h1>

    <table border="1">
    <thead>
        <th>Restaurant Name</th>
        <th>Picture</th>
        <th>Cuisine</th>
        <th>Rating</th>
        <th>Operation</th>
    </thead>
    <tbody>
        {% for r in restaurantList %}
            <tr>
                <td>{{ r.name}}</td>
                <td><img src="{{ r.picture }}" alt=""></td>
                <td>{{r.cuisine}}</td>
                <td>{{ r.rating }}</td>
                <td> 
                    <a href="{% url 'view_menu' r.id username %}">View Menu</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
