{% extends 'base.html' %}
{% block title %}Menu{% endblock %}
{% block nav_right %}
<span class="nav-user">Hi, {{ username }}</span>
<a href="{% url 'show_cart' username %}">Cart</a>
{% endblock %}
{% block content %}
<div class="container">
    <h1>Menu</h1>

    {% for r in itemList %}
        <div class="row-card">
            <img src="{{ r.picture }}" alt="{{ r.name }}">
            <div class="info">
                <div class="name">
                    {{ r.name }}
                    {% if r.vegetarian %}<span class="veg-dot"></span>{% endif %}
                </div>
                <div class="desc">{{ r.description }}</div>
                <div class="price">₹{{ r.price }}</div>
            </div>
            <div class="actions">
                <a href="{% url 'add_to_cart' r.id username %}" class="btn btn-primary btn-sm">Add</a>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
